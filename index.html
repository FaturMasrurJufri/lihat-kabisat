<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leap Year Checker Luxury</title>
    <style>
        /* Gaya Dasar & Latar Belakang Mewah */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0f0f12 0%, #1a1a24 100%);
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        /* Kartu Aplikasi Utama (Efek Kaca / Glassmorphism) */
        .card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            padding: 40px 30px;
            border-radius: 24px;
            width: 100%;
            max-width: 450px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4), 
                        inset 0 1px 0 rgba(255, 255, 255, 0.1);
            text-align: center;
            position: relative;
        }

        /* Header & Judul */
        h1 {
            font-size: 26px;
            font-weight: 700;
            letter-spacing: 1px;
            background: linear-gradient(45deg, #ffe259, #ffa751);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
        }

        /* Animasi Kelap-Kelip di Bawah Judul */
        .glowing-line {
            height: 3px;
            width: 60px;
            background: linear-gradient(90deg, #ffe259, #ffa751);
            margin: 0 auto 25px auto;
            border-radius: 2px;
            box-shadow: 0 0 8px #ffa751;
            animation: blink 1.5s infinite ease-in-out;
        }

        @keyframes blink {
            0%, 100% { opacity: 0.3; transform: scaleX(0.8); box-shadow: 0 0 2px #ffa751; }
            50% { opacity: 1; transform: scaleX(1.2); box-shadow: 0 0 15px #ffe259; }
        }

        /* Badge Developer Fatur62 */
        .dev-badge {
            display: inline-flex;
            align-items: center;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 6px 14px;
            border-radius: 30px;
            font-size: 12px;
            font-weight: 600;
            color: #d1d1d6;
            letter-spacing: 0.5px;
            margin-bottom: 30px;
        }

        /* Bulatan Kecil Sebelah Kiri Badge */
        .badge-dot {
            width: 8px;
            height: 8px;
            background-color: #00e676; /* Warna hijau aktif */
            border-radius: 50%;
            margin-right: 8px;
            box-shadow: 0 0 8px #00e676;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(0, 230, 118, 0.7); }
            70% { box-shadow: 0 0 0 6px rgba(0, 230, 118, 0); }
            100% { box-shadow: 0 0 0 0 rgba(0, 230, 118, 0); }
        }

        /* Input Form */
        .input-group {
            margin-bottom: 20px;
            text-align: left;
        }

        label {
            display: block;
            font-size: 13px;
            color: #aaa;
            margin-bottom: 8px;
            margin-left: 4px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        input[type="number"] {
            width: 100%;
            padding: 16px;
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 14px;
            color: #fff;
            font-size: 16px;
            transition: all 0.3s ease;
            text-align: center;
        }

        input[type="number"]:focus {
            outline: none;
            border-color: #ffa751;
            box-shadow: 0 0 15px rgba(255, 167, 81, 0.2);
            background: rgba(0, 0, 0, 0.4);
        }

        /* Tombol Cek Elektronik */
        button {
            width: 100%;
            padding: 16px;
            background: linear-gradient(45deg, #ffa751, #ffe259);
            border: none;
            border-radius: 14px;
            color: #0f0f12;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(255, 167, 81, 0.3);
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(255, 167, 81, 0.5);
        }

        button:active {
            transform: translateY(1px);
        }

        /* Area Hasil / Output */
        .result-box {
            margin-top: 25px;
            padding: 20px;
            border-radius: 14px;
            font-size: 15px;
            line-height: 1.5;
            display: none; /* Sembunyi sebelum dicek */
            animation: fadeIn 0.5s ease forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .kabisat {
            background: rgba(0, 230, 118, 0.1);
            border: 1px solid rgba(0, 230, 118, 0.3);
            color: #b9ffd7;
        }

        .bukan-kabisat {
            background: rgba(255, 61, 0, 0.1);
            border: 1px solid rgba(255, 61, 0, 0.3);
            color: #ffcbd2;
        }
    </style>
</head>
<body>

    <div class="card">
        <!-- Header Aplikasi -->
        <h1>LEAP YEAR CHECKER</h1>
        <!-- Animasi Kelap-Kelip -->
        <div class="glowing-line"></div>

        <!-- Badge Request User -->
        <div class="dev-badge">
            <span class="badge-dot"></span>
            developer: fatur62
        </div>

        <!-- Form Input -->
        <div class="input-group">
            <label for="tahunInput">Masukkan Angka Tahun</label>
            <input type="number" id="tahunInput" placeholder="Contoh: 2024" min="1">
        </div>

        <button onclick="prosesCekTahun()">Periksa Tahun</button>

        <!-- Tempat Output Hasil -->
        <div id="result" class="result-box"></div>
    </div>

    <script>
        function prosesCekTahun() {
            const inputElement = document.getElementById("tahunInput");
            const resultBox = document.getElementById("result");
            const tahun = parseInt(inputElement.value);

            // Validasi jika input kosong
            if (isNaN(tahun) || tahun < 1) {
                resultBox.style.display = "block";
                resultBox.className = "result-box bukan-kabisat";
                resultBox.innerHTML = "⚠️ Harap masukkan angka tahun yang valid!";
                return;
            }

            let apakahKabisat = false;

            // Logika Matematika Rahasia Tahun Kabisat
            if (tahun % 400 === 0) {
                apakahKabisat = true;
            } else if (tahun % 100 === 0) {
                apakahKabisat = false;
            } else if (tahun % 4 === 0) {
                apakahKabisat = true;
            }

            // Memunculkan hasil dengan desain mewah sesuai statusnya
            resultBox.style.display = "block";
            
            if (apakahKabisat) {
                resultBox.className = "result-box kabisat";
                resultBox.innerHTML = `✨ <strong>Tahun ${tahun} adalah Tahun Kabisat!</strong><br>Bulan Februari memiliki 29 hari.`;
            } else {
                resultBox.className = "result-box bukan-kabisat";
                resultBox.innerHTML = `📅 <strong>Tahun ${tahun} adalah Tahun Biasa.</strong><br>Bulan Februari hanya memiliki 28 hari.`;
            }
        }
    </script>
</body>
</html>
