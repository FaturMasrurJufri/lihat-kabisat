<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leap Year Checker Luxury</title>
    <style>
        /* Gaya Dasar & Latar Belakang Mewah */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0f0f12 0%, #1a1a24 100%);
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        /* Kartu Aplikasi Utama (Glassmorphism) */
        .card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            padding: 40px 30px;
            border-radius: 24px;
            width: 100%;
            max-width: 480px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4), 
                        inset 0 1px 0 rgba(255, 255, 255, 0.1);
            text-align: center;
            position: relative;
        }

        /* Header & Judul */
        h1 {
            font-size: 26px;
            font-weight: 700;
            letter-spacing: 1px;
            background: linear-gradient(45deg, #ffe259, #ffa751);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
        }

        .glowing-line {
            height: 3px;
            width: 60px;
            background: linear-gradient(90deg, #ffe259, #ffa751);
            margin: 0 auto 25px auto;
            border-radius: 2px;
            box-shadow: 0 0 8px #ffa751;
            animation: blink 1.5s infinite ease-in-out;
        }

        @keyframes blink {
            0%, 100% { opacity: 0.3; transform: scaleX(0.8); box-shadow: 0 0 2px #ffa751; }
            50% { opacity: 1; transform: scaleX(1.2); box-shadow: 0 0 15px #ffe259; }
        }

        /* Badge Developer */
        .dev-badge {
            display: inline-flex;
            align-items: center;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 6px 14px;
            border-radius: 30px;
            font-size: 12px;
            font-weight: 600;
            color: #d1d1d6;
            letter-spacing: 0.5px;
            margin-bottom: 30px;
        }

        .badge-dot {
            width: 8px;
            height: 8px;
            background-color: #00e676;
            border-radius: 50%;
            margin-right: 8px;
            box-shadow: 0 0 8px #00e676;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(0, 230, 118, 0.7); }
            70% { box-shadow: 0 0 0 6px rgba(0, 230, 118, 0); }
            100% { box-shadow: 0 0 0 0 rgba(0, 230, 118, 0); }
        }

        /* Input Form */
        .input-group {
            margin-bottom: 20px;
            text-align: left;
        }

        label {
            display: block;
            font-size: 13px;
            color: #aaa;
            margin-bottom: 8px;
            margin-left: 4px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        input[type="number"] {
            width: 100%;
            padding: 16px;
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 14px;
            color: #fff;
            font-size: 16px;
            transition: all 0.3s ease;
            text-align: center;
        }

        input[type="number"]:focus {
            outline: none;
            border-color: #ffa751;
            box-shadow: 0 0 15px rgba(255, 167, 81, 0.2);
            background: rgba(0, 0, 0, 0.4);
        }

        button {
            width: 100%;
            padding: 16px;
            background: linear-gradient(45deg, #ffa751, #ffe259);
            border: none;
            border-radius: 14px;
            color: #0f0f12;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(255, 167, 81, 0.3);
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(255, 167, 81, 0.5);
        }

        button:active {
            transform: translateY(1px);
        }

        /* Area Hasil & Kotak Penjelasan */
        .result-box {
            margin-top: 25px;
            padding: 22px;
            border-radius: 16px;
            font-size: 14px;
            line-height: 1.6;
            display: none;
            text-align: left;
            animation: fadeIn 0.4s ease forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .result-title {
            font-size: 16px;
            font-weight: 700;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .reason-box {
            background: rgba(0, 0, 0, 0.25);
            border-radius: 10px;
            padding: 12px 14px;
            margin-top: 12px;
            border-left: 3px solid currentColor;
            font-size: 13px;
        }

        .kabisat {
            background: rgba(0, 230, 118, 0.08);
            border: 1px solid rgba(0, 230, 118, 0.3);
            color: #b9ffd7;
        }

        .bukan-kabisat {
            background: rgba(255, 61, 0, 0.08);
            border: 1px solid rgba(255, 61, 0, 0.3);
            color: #ffcbd2;
        }

        .warning-box {
            background: rgba(255, 193, 7, 0.08);
            border: 1px solid rgba(255, 193, 7, 0.3);
            color: #ffe082;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>LEAP YEAR CHECKER</h1>
        <div class="glowing-line"></div>

        <div class="dev-badge">
            <span class="badge-dot"></span>
            developer: fatur62
        </div>

        <form id="leapYearForm" class="input-group">
            <label for="tahunInput">Masukkan Angka Tahun</label>
            <input type="number" id="tahunInput" placeholder="Contoh: 2000, 2024, 2100" min="1" required>
            <button type="submit" style="margin-top: 15px;">Periksa Tahun</button>
        </form>

        <div id="result" class="result-box"></div>
    </div>

    <script>
        document.getElementById("leapYearForm").addEventListener("submit", function(event) {
            event.preventDefault();
            evaluasiTahunKabisat();
        });

        function evaluasiTahunKabisat() {
            const inputElement = document.getElementById("tahunInput");
            const resultBox = document.getElementById("result");
            
            const rawValue = inputElement.value.trim();
            const tahun = Number(rawValue);

            if (!rawValue || !Number.isInteger(tahun) || tahun < 1) {
                resultBox.style.display = "block";
                resultBox.className = "result-box warning-box";
                resultBox.innerHTML = "⚠️ Harap masukkan angka tahun bulat positif yang valid!";
                return;
            }

            let statusKabisat = false;
            let tipeKasus = "";
            let alasan = "";

            // Aturan Kalender Gregorian:
            // 1. Habis dibagi 400 -> Pasti Kabisat (Pengecualian khusus tahun abad)
            // 2. Habis dibagi 100 tapi tidak habis dibagi 400 -> Pengecualian: Bukan Kabisat
            // 3. Habis dibagi 4 tapi bukan kelipatan 100 -> Kabisat reguler
            // 4. Tidak habis dibagi 4 -> Tahun Biasa

            if (tahun % 400 === 0) {
                statusKabisat = true;
                tipeKasus = "Kelipatan 400 (Pengecualian Khusus Abad)";
                alasan = `Tahun <strong>${tahun}</strong> habis dibagi 400 (${tahun} / 400 = ${tahun / 400}). Berdasarkan sistem kalender Gregorian, setiap pergantian abad yang habis dibagi 400 <em>dikecualikan dari aturan pembatalan abad</em> dan tetap menjadi <strong>Tahun Kabisat</strong>.`;
            } else if (tahun % 100 === 0) {
                statusKabisat = false;
                tipeKasus = "Kelipatan 100 Bukan Kelipatan 400 (Pengecualian Abad)";
                alasan = `Meskipun habis dibagi 4 (${tahun} / 4 = ${tahun / 4}), tahun <strong>${tahun}</strong> adalah tahun pergantian abad (kelipatan 100) dan <strong>tidak habis dibagi 400</strong> (sisa bagi: ${tahun % 400}). Oleh karena itu, tahun ini gugur dan menjadi <strong>Tahun Biasa</strong> untuk mengoreksi akumulasi kelebihan waktu orbit bumi.`;
            } else if (tahun % 4 === 0) {
                statusKabisat = true;
                tipeKasus = "Kelipatan 4 Standar";
                alasan = `Tahun <strong>${tahun}</strong> habis dibagi 4 (${tahun} / 4 = ${tahun / 4}) dan bukan merupakan tahun abad (tidak habis dibagi 100). Maka secara reguler masuk kriteria <strong>Tahun Kabisat</strong>.`;
            } else {
                statusKabisat = false;
                tipeKasus = "Bukan Kelipatan 4";
                alasan = `Tahun <strong>${tahun}</strong> tidak habis dibagi 4 (sisa bagi: ${tahun % 4}). Syarat dasar tahun kabisat adalah habis dibagi 4, sehingga tahun ini merupakan <strong>Tahun Biasa</strong>.`;
            }

            renderOutput(statusKabisat, tahun, tipeKasus, alasan);
        }

        function renderOutput(isKabisat, tahun, tipe, deskripsi) {
            const resultBox = document.getElementById("result");
            resultBox.style.display = "block";

            if (isKabisat) {
                resultBox.className = "result-box kabisat";
                resultBox.innerHTML = `
                    <div class="result-title">
                        <span>✨</span>
                        <span>Tahun ${tahun} adalah Tahun Kabisat</span>
                    </div>
                    <div>Februari memiliki <strong>29 hari</strong> (Total 366 hari setahun).</div>
                    <div class="reason-box">
                        <strong>Kategori:</strong> ${tipe}<br>
                        <strong>Analisis:</strong> ${deskripsi}
                    </div>
                `;
            } else {
                resultBox.className = "result-box bukan-kabisat";
                resultBox.innerHTML = `
                    <div class="result-title">
                        <span>📅</span>
                        <span>Tahun ${tahun} adalah Tahun Biasa</span>
                    </div>
                    <div>Februari hanya memiliki <strong>28 hari</strong> (Total 365 hari setahun).</div>
                    <div class="reason-box">
                        <strong>Kategori:</strong> ${tipe}<br>
                        <strong>Analisis:</strong> ${deskripsi}
                    </div>
                `;
            }
        }
    </script>
</body>
</html>
